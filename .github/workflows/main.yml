name: Update Holiday Data from 1823

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

concurrency:
  group: update-holiday
  cancel-in-progress: false

jobs:
  update-holiday:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --break-system-packages requests

      - name: Fetch and merge holiday data
        run: python .github/scripts/update_holiday.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/tools/js/holiday.js public/tools/other-working-days.html
          if git diff --staged --quiet; then
            echo "No staged changes; skipping commit."
          else
            git commit -m "Update Hong Kong public holiday data from 1823"
            git push
          fi
