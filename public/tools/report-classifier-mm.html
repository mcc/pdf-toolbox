<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart PDF OCR & Splitter</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <!-- Tesseract.js for OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <!-- PDF-Lib for splitting PDFs -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <!-- JSZip & FileSaver for bulk export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Icon Components (Inline SVGs to avoid dependency issues) ---
        const IconSettings = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
        const IconUpload = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>;
        const IconPlay = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
        const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const IconDownload = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;
        const IconFileText = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>;
        const IconRefresh = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>;

        // --- Default Configuration Based on User Use Case ---
        const defaultRules = [
            {
                id: 'rule1',
                name: 'Interview Board Report',
                keywords: 'Interview Result',
                fields: [
                    { id: 'f1', name: 'Report Number', type: 'prefix', pattern: 'Report no.' },
                    { id: 'f2', name: 'Post', type: 'regex', pattern: 'Engagement of Contract[\\s\\-]*([A-Za-z\\s]+)\\(' }
                ],
                filenameTemplate: 'T26_{Post}_Interview Board Report_Bid-{Report Number}.pdf',
                inheritPrevious: false
            },
            {
                id: 'rule2',
                name: 'Interview Assessment Form',
                keywords: 'Assessment Form, Candidate Ref',
                fields: [
                    { id: 'f3', name: 'Candidate Ref. No.', type: 'prefix', pattern: 'Ref. No.' },
                    { id: 'f4', name: 'Name', type: 'prefix', pattern: 'Name:' }
                ],
                filenameTemplate: 'T26_{Post}_Interview Assessment Form_Bid-{Report Number}_Ref-{Candidate Ref. No.}.pdf',
                inheritPrevious: true
            }
        ];

        // --- Helper: Convert simple prefix to Regex ---
        function buildRegex(fieldType, pattern) {
            if (!pattern) return null;
            if (fieldType === 'regex') {
                try {
                    return new RegExp(pattern, 'i');
                } catch(e) { return null; }
            }
            if (fieldType === 'prefix') {
                // Escape special characters in prefix
                const escapedPrefix = pattern.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                // Looks for prefix, optional spaces/colons/dashes, then captures the rest of the line
                return new RegExp(escapedPrefix + '[\\s:;\\-_]*([^\\n]+)', 'i');
            }
            return null;
        }

        // --- Main Application Component ---
        const App = () => {
            const [rules, setRules] = useState(defaultRules);
            const [showRules, setShowRules] = useState(false);
            const [files, setFiles] = useState([]);
            
            // Processing State
            const [isProcessing, setIsProcessing] = useState(false);
            const [progressText, setProgressText] = useState("");
            const [progressPercent, setProgressPercent] = useState(0);
            
            // Results State
            const [results, setResults] = useState(null);
            const [fileBuffers, setFileBuffers] = useState({});
            const [ocrCache, setOcrCache] = useState(null); // Added for Re-run feature

            const handleFileUpload = (e) => {
                const uploadedFiles = Array.from(e.target.files).filter(f => f.type === 'application/pdf');
                setFiles(prev => [...prev, ...uploadedFiles]);
            };

            const removeFile = (index) => {
                setFiles(prev => prev.filter((_, i) => i !== index));
            };

            // --- Core Processing Logic ---
            const applyRules = (cache) => {
                setIsProcessing(true);
                setProgressText("Applying rules and extracting data...");
                setProgressPercent(50);
                
                setTimeout(() => {
                    try {
                        const newResults = [];
                        let sharedFields = {}; // Moved outside the file loop to inherit variables across multiple files

                        for (const fileData of cache) {
                            let currentDoc = null;
                            const extractedDocs = [];
                            
                            for (const page of fileData.pages) {
                                const { pageNum, text } = page;
                                
                                let matchedRule = null;
                                for (const rule of rules) {
                                    if (!rule.keywords || rule.keywords.trim() === '') continue;
                                    const keywords = rule.keywords.split(',').map(k => k.trim().toLowerCase()).filter(k=>k);
                                    const textLower = text.toLowerCase();
                                    if (keywords.some(kw => textLower.includes(kw))) {
                                        matchedRule = rule;
                                        break;
                                    }
                                }

                                if (matchedRule) {
                                    if (currentDoc) extractedDocs.push(currentDoc);
                                    currentDoc = {
                                        sourceFileName: fileData.fileName,
                                        typeId: matchedRule.id,
                                        typeName: matchedRule.name,
                                        startPage: pageNum,
                                        endPage: pageNum,
                                        text: text + "\n",
                                        rule: matchedRule
                                    };
                                } else {
                                    if (currentDoc) {
                                        currentDoc.endPage = pageNum;
                                        currentDoc.text += text + "\n";
                                    } else {
                                        currentDoc = {
                                            sourceFileName: fileData.fileName,
                                            typeId: 'unknown',
                                            typeName: 'Unknown Document',
                                            startPage: pageNum,
                                            endPage: pageNum,
                                            text: text + "\n",
                                            rule: null
                                        };
                                    }
                                }
                            }
                            if (currentDoc) extractedDocs.push(currentDoc);

                            for (const doc of extractedDocs) {
                                let docFields = {};
                                if (doc.rule) {
                                    if (doc.rule.inheritPrevious) {
                                        docFields = { ...sharedFields };
                                    }
                                    doc.rule.fields.forEach(field => {
                                        const regex = buildRegex(field.type, field.pattern);
                                        if (regex) {
                                            const match = doc.text.match(regex);
                                            let val = match ? (match[1] ? match[1].trim() : match[0].trim()) : '';
                                            val = val.replace(/[\r\n]+/g, ''); 
                                            if (val) {
                                                docFields[field.name] = val;
                                                sharedFields[field.name] = val; // Store globally for inheritance
                                            }
                                        }
                                    });
                                }

                                let filename = doc.rule ? doc.rule.filenameTemplate : `Unknown_Document_${doc.startPage}.pdf`;
                                Object.keys(docFields).forEach(key => {
                                    const safeVal = docFields[key] ? docFields[key].replace(/[\\/:*?"<>|]/g, '') : `MISSING_${key}`;
                                    filename = filename.replace(new RegExp(`{${key}}`, 'g'), safeVal);
                                });
                                if (!filename.toLowerCase().endsWith('.pdf')) filename += '.pdf';

                                newResults.push({
                                    id: crypto.randomUUID(),
                                    ...doc,
                                    fields: docFields,
                                    finalFilename: filename
                                });
                            }
                        }
                        setResults(newResults);
                    } catch (error) {
                        console.error(error);
                        alert("An error occurred applying rules.");
                    } finally {
                        setIsProcessing(false);
                    }
                }, 100);
            };

            const startProcessing = async () => {
                if (files.length === 0) return;
                setIsProcessing(true);
                setResults(null);
                setFileBuffers({});
                
                let tesseractWorker = null;
                const buffers = {};
                const cache = [];
                
                try {
                    setProgressText("Initializing OCR Engine...");
                    setProgressPercent(5);
                    tesseractWorker = await Tesseract.createWorker('eng');

                    let totalPages = 0;
                    let processedPages = 0;

                    // Pass 1: Count total pages for accurate progress bar
                    for (const file of files) {
                        const buffer = await file.arrayBuffer();
                        buffers[file.name] = buffer;
                        // Use .slice(0) to pass a copy and prevent PDF.js from detaching the original buffer
                        const pdfDoc = await pdfjsLib.getDocument(buffer.slice(0)).promise;
                        totalPages += pdfDoc.numPages;
                    }
                    setFileBuffers(buffers);

                    // Pass 2: OCR each file
                    for (const file of files) {
                        const buffer = buffers[file.name];
                        // Use .slice(0) to pass a copy and prevent Detached ArrayBuffer Error
                        const pdfDoc = await pdfjsLib.getDocument(buffer.slice(0)).promise;
                        const fileCache = { fileName: file.name, pages: [] };

                        for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                            setProgressText(`OCRing ${file.name} (Page ${pageNum}/${pdfDoc.numPages})...`);
                            
                            // Render page to canvas
                            const page = await pdfDoc.getPage(pageNum);
                            const viewport = page.getViewport({ scale: 1.5 }); // 1.5 for better text clarity
                            const canvas = document.createElement('canvas');
                            const context = canvas.getContext('2d');
                            canvas.height = viewport.height;
                            canvas.width = viewport.width;
                            await page.render({ canvasContext: context, viewport: viewport }).promise;

                            // OCR the canvas
                            const { data: { text } } = await tesseractWorker.recognize(canvas);
                            processedPages++;
                            setProgressPercent(10 + Math.floor((processedPages / totalPages) * 70)); // Uses 10-80% of progress

                            fileCache.pages.push({ pageNum, text });
                        }
                        cache.push(fileCache);
                    }

                    setOcrCache(cache);
                    applyRules(cache);

                } catch (error) {
                    console.error(error);
                    alert("An error occurred during processing. Please check console.");
                    setIsProcessing(false);
                } finally {
                    if (tesseractWorker) await tesseractWorker.terminate();
                }
            };

            // --- Handlers for Results Editing ---
            const handleFieldChange = (resultId, fieldName, newValue) => {
                setResults(prev => prev.map(res => {
                    if (res.id !== resultId) return res;
                    const updatedFields = { ...res.fields, [fieldName]: newValue };
                    
                    // Re-calculate filename
                    let newFilename = res.rule ? res.rule.filenameTemplate : `Unknown_Document_${res.startPage}.pdf`;
                    Object.keys(updatedFields).forEach(key => {
                        const safeVal = updatedFields[key] ? updatedFields[key].replace(/[\\/:*?"<>|]/g, '') : `MISSING_${key}`;
                        newFilename = newFilename.replace(new RegExp(`{${key}}`, 'g'), safeVal);
                    });
                    if (!newFilename.toLowerCase().endsWith('.pdf')) newFilename += '.pdf';

                    return { ...res, fields: updatedFields, finalFilename: newFilename };
                }));
            };

            const handleFilenameChange = (resultId, newName) => {
                setResults(prev => prev.map(res => res.id === resultId ? { ...res, finalFilename: newName } : res));
            };

            // --- Bulk Export Logic (JSZip + PDF-Lib) ---
            const downloadAll = async () => {
                setIsProcessing(true);
                setProgressText("Generating final PDFs...");
                setProgressPercent(10);
                
                try {
                    const zip = new JSZip();
                    
                    // Prepare CSV headers
                    const allFieldNames = new Set();
                    results.forEach(res => Object.keys(res.fields).forEach(f => allFieldNames.add(f)));
                    const headers = ["Source File", "Document Type", "Pages", "Output Filename", ...Array.from(allFieldNames)];
                    
                    let csvContent = headers.join(",") + "\n";
                    
                    // Generate PDFs
                    let i = 0;
                    for (const res of results) {
                        i++;
                        setProgressPercent(10 + Math.floor((i / results.length) * 80));
                        setProgressText(`Splitting ${res.finalFilename}...`);
                        
                        // Load source PDF
                        const sourceBytes = fileBuffers[res.sourceFileName];
                        // Pass a copy using slice(0) to prevent detachment issues
                        const pdfDoc = await PDFLib.PDFDocument.load(sourceBytes.slice(0));
                        
                        // Create new PDF
                        const newPdf = await PDFLib.PDFDocument.create();
                        
                        // Calculate page indices (0-based)
                        const pageIndices = [];
                        for (let p = res.startPage; p <= res.endPage; p++) {
                            pageIndices.push(p - 1);
                        }
                        
                        // Copy and add pages
                        const copiedPages = await newPdf.copyPages(pdfDoc, pageIndices);
                        copiedPages.forEach(page => newPdf.addPage(page));
                        
                        // Save and add to ZIP
                        const pdfBytes = await newPdf.save();
                        zip.file(res.finalFilename, pdfBytes);
                        
                        // Add CSV Row
                        const row = [
                            `"${res.sourceFileName}"`,
                            `"${res.typeName}"`,
                            `"${res.startPage}-${res.endPage}"`,
                            `"${res.finalFilename}"`
                        ];
                        Array.from(allFieldNames).forEach(field => {
                            const val = res.fields[field] || '';
                            row.push(`"${val.replace(/"/g, '""')}"`);
                        });
                        csvContent += row.join(",") + "\n";
                    }
                    
                    zip.file("extracted_data.csv", csvContent);
                    
                    setProgressText("Zipping files...");
                    setProgressPercent(95);
                    const blob = await zip.generateAsync({ type: "blob" });
                    saveAs(blob, "processed_documents.zip");
                    
                } catch (err) {
                    console.error(err);
                    alert("Error exporting files.");
                } finally {
                    setIsProcessing(false);
                }
            };

            // --- Rule Management ---
            const addRule = () => {
                setRules([...rules, {
                    id: crypto.randomUUID(),
                    name: 'New Document Type',
                    keywords: '',
                    fields: [],
                    filenameTemplate: 'Document.pdf',
                    inheritPrevious: false
                }]);
            };

            const updateRule = (id, key, val) => {
                setRules(rules.map(r => r.id === id ? { ...r, [key]: val } : r));
            };

            const removeRule = (id) => setRules(rules.filter(r => r.id !== id));

            const addField = (ruleId) => {
                setRules(rules.map(r => {
                    if (r.id === ruleId) {
                        return { ...r, fields: [...r.fields, { id: crypto.randomUUID(), name: '', type: 'prefix', pattern: '' }] };
                    }
                    return r;
                }));
            };

            const updateField = (ruleId, fieldId, key, val) => {
                setRules(rules.map(r => {
                    if (r.id === ruleId) {
                        return { ...r, fields: r.fields.map(f => f.id === fieldId ? { ...f, [key]: val } : f) };
                    }
                    return r;
                }));
            };

            const removeField = (ruleId, fieldId) => {
                setRules(rules.map(r => {
                    if (r.id === ruleId) {
                        return { ...r, fields: r.fields.filter(f => f.id !== fieldId) };
                    }
                    return r;
                }));
            };

            return (
                <div className="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
                    {/* Header */}
                    <div className="mb-8 border-b pb-4 flex justify-between items-end">
                        <div>
                            <h1 className="text-3xl font-bold text-gray-900 tracking-tight">Smart PDF OCR & Splitter</h1>
                            <p className="text-gray-500 mt-2">Upload scanned PDFs, auto-classify, extract fields, and split.</p>
                        </div>
                        <button 
                            onClick={() => setShowRules(!showRules)}
                            className="flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 transition"
                        >
                            <IconSettings /> {showRules ? 'Hide Configuration' : 'Configure Rules'}
                        </button>
                    </div>

                    {/* Rule Configuration Section */}
                    {showRules && (
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8 animate-[fadeIn_0.2s_ease-out]">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-xl font-semibold text-gray-800">Document Type Rules</h2>
                                <button onClick={addRule} className="flex items-center gap-1 text-sm bg-blue-50 text-blue-600 px-3 py-1.5 rounded-md hover:bg-blue-100 transition">
                                    <IconPlus /> Add Document Type
                                </button>
                            </div>
                            
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                {rules.map((rule, idx) => (
                                    <div key={rule.id} className="border border-gray-200 rounded-lg p-5 bg-gray-50 relative">
                                        <button onClick={() => removeRule(rule.id)} className="absolute top-4 right-4 text-gray-400 hover:text-red-500">
                                            <IconTrash />
                                        </button>
                                        
                                        <div className="mb-4">
                                            <label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Document Name</label>
                                            <input type="text" value={rule.name} onChange={e => updateRule(rule.id, 'name', e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. Interview Board Report" />
                                        </div>

                                        <div className="mb-4">
                                            <label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Trigger Keywords (comma separated)</label>
                                            <input type="text" value={rule.keywords} onChange={e => updateRule(rule.id, 'keywords', e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. Board Report, Assessment Form" />
                                        </div>

                                        <div className="mb-4 border-t pt-4">
                                            <div className="flex justify-between items-center mb-2">
                                                <label className="block text-xs font-semibold text-gray-500 uppercase">Extraction Fields</label>
                                                <button onClick={() => addField(rule.id)} className="text-xs text-blue-600 hover:text-blue-800 font-medium">+ Add Field</button>
                                            </div>
                                            {rule.fields.map(field => (
                                                <div key={field.id} className="flex gap-2 mb-2 items-start bg-white p-2 border rounded shadow-sm">
                                                    <div className="flex-1">
                                                        <input type="text" value={field.name} onChange={e => updateField(rule.id, field.id, 'name', e.target.value)} placeholder="Field Name (e.g. Report Number)" className="w-full px-2 py-1 text-sm border-b border-transparent focus:border-blue-500 outline-none mb-1 font-medium" />
                                                        <div className="flex gap-2">
                                                            <select value={field.type} onChange={e => updateField(rule.id, field.id, 'type', e.target.value)} className="text-xs border border-gray-300 rounded px-1 bg-gray-50">
                                                                <option value="prefix">Prefix (Easy)</option>
                                                                <option value="regex">Regex (Adv.)</option>
                                                            </select>
                                                            <input type="text" value={field.pattern} onChange={e => updateField(rule.id, field.id, 'pattern', e.target.value)} placeholder={field.type === 'prefix' ? "e.g. Report no." : "Regex pattern"} className="w-full px-2 py-1 text-xs border border-gray-300 rounded outline-none" />
                                                        </div>
                                                    </div>
                                                    <button onClick={() => removeField(rule.id, field.id)} className="p-1 text-gray-400 hover:text-red-500 mt-1"><IconTrash /></button>
                                                </div>
                                            ))}
                                            {rule.fields.length === 0 && <p className="text-xs text-gray-400 italic">No fields defined. Filename cannot use variables.</p>}
                                        </div>

                                        <div className="mb-3 border-t pt-4">
                                            <label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Output Filename Template</label>
                                            <input type="text" value={rule.filenameTemplate} onChange={e => updateRule(rule.id, 'filenameTemplate', e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500 outline-none font-mono text-xs" placeholder="Document - {Report Number}.pdf" />
                                            <p className="text-[10px] text-gray-400 mt-1">Use {'{FieldName}'} to inject extracted values.</p>
                                        </div>

                                        <div className="flex items-center mt-2">
                                            <input type="checkbox" id={`inherit-${rule.id}`} checked={rule.inheritPrevious} onChange={e => updateRule(rule.id, 'inheritPrevious', e.target.checked)} className="h-4 w-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500" />
                                            <label htmlFor={`inherit-${rule.id}`} className="ml-2 block text-sm text-gray-700">Inherit missing variables from previous documents (e.g. link Assessment Form to Board Report)</label>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Main Workspace (Upload & Process) */}
                    {!results && (
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-8 text-center max-w-3xl mx-auto">
                            {!isProcessing ? (
                                <>
                                    <div className="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-500">
                                        <IconUpload />
                                    </div>
                                    <h2 className="text-xl font-semibold mb-2">Upload Scanned PDFs</h2>
                                    <p className="text-gray-500 text-sm mb-6">Select single or multiple PDFs containing scanned documents.</p>
                                    
                                    <label className="cursor-pointer bg-white border-2 border-dashed border-gray-300 hover:border-blue-500 hover:bg-blue-50 transition-colors rounded-xl px-6 py-10 block mb-6">
                                        <span className="text-gray-600 font-medium flex justify-center items-center gap-2">
                                            Browse Files
                                        </span>
                                        <input type="file" multiple accept="application/pdf" onChange={handleFileUpload} className="hidden" />
                                    </label>

                                    {files.length > 0 && (
                                        <div className="text-left bg-gray-50 p-4 rounded-lg mb-6 border border-gray-100 max-h-40 overflow-y-auto custom-scrollbar">
                                            <h3 className="text-sm font-semibold text-gray-700 mb-2">Selected Files:</h3>
                                            <ul className="text-sm text-gray-600 space-y-1">
                                                {files.map((file, idx) => (
                                                    <li key={idx} className="flex justify-between items-center">
                                                        <span className="truncate mr-4"><IconFileText /> <span className="align-middle ml-1">{file.name}</span></span>
                                                        <button onClick={() => removeFile(idx)} className="text-red-500 hover:text-red-700 font-medium text-xs">Remove</button>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    )}

                                    <button 
                                        onClick={startProcessing}
                                        disabled={files.length === 0}
                                        className={`w-full flex items-center justify-center gap-2 py-3 px-4 rounded-lg text-white font-medium shadow-sm transition ${files.length > 0 ? 'bg-blue-600 hover:bg-blue-700' : 'bg-gray-300 cursor-not-allowed'}`}
                                    >
                                        <IconPlay /> Start Smart Processing
                                    </button>
                                </>
                            ) : (
                                <div className="py-12">
                                    <div className="loader mx-auto mb-6 border-blue-600 border-t-transparent"></div>
                                    <h2 className="text-lg font-semibold text-gray-800 mb-2">Processing Documents</h2>
                                    <p className="text-sm text-gray-500 mb-6">{progressText}</p>
                                    
                                    <div className="w-full bg-gray-200 rounded-full h-2.5 mb-2 overflow-hidden">
                                        <div className="bg-blue-600 h-2.5 rounded-full transition-all duration-300 ease-out" style={{ width: `${progressPercent}%` }}></div>
                                    </div>
                                    <p className="text-xs text-gray-400 text-right">{progressPercent}%</p>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Results Table */}
                    {results && !isProcessing && (
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden animate-[fadeIn_0.3s_ease-out]">
                            <div className="px-6 py-5 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                                <div>
                                    <h2 className="text-lg font-semibold text-gray-800">Review & Export Extracted Data</h2>
                                    <p className="text-sm text-gray-500 mt-1">Found {results.length} logical documents. You can manually correct fields before downloading.</p>
                                </div>
                                <div className="flex items-center gap-3">
                                    {ocrCache && (
                                        <button onClick={() => applyRules(ocrCache)} className="flex items-center gap-2 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-4 py-2.5 rounded-lg text-sm font-medium shadow-sm transition">
                                            <IconRefresh /> Re-apply Rules
                                        </button>
                                    )}
                                    <button onClick={downloadAll} className="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium shadow-sm transition">
                                        <IconDownload /> Download ZIP & CSV
                                    </button>
                                </div>
                            </div>
                            
                            <div className="overflow-x-auto custom-scrollbar max-h-[600px] overflow-y-auto">
                                <table className="w-full text-left text-sm whitespace-nowrap">
                                    <thead className="text-xs text-gray-600 uppercase bg-gray-50 sticky top-0 shadow-sm z-10">
                                        <tr>
                                            <th className="px-6 py-4 font-semibold">Source</th>
                                            <th className="px-6 py-4 font-semibold">Doc Type</th>
                                            <th className="px-6 py-4 font-semibold">Pages</th>
                                            <th className="px-6 py-4 font-semibold">Extracted Values</th>
                                            <th className="px-6 py-4 font-semibold">Proposed Filename</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-200">
                                        {results.map((res, index) => (
                                            <tr key={res.id} className="hover:bg-gray-50/50 transition-colors">
                                                <td className="px-6 py-4 text-gray-500 max-w-[150px] truncate" title={res.sourceFileName}>{res.sourceFileName}</td>
                                                <td className="px-6 py-4 font-medium text-gray-900">
                                                    <span className={`px-2.5 py-1 rounded-full text-xs ${res.typeId === 'unknown' ? 'bg-gray-100 text-gray-700' : 'bg-blue-100 text-blue-700'}`}>
                                                        {res.typeName}
                                                    </span>
                                                </td>
                                                <td className="px-6 py-4 text-gray-500">{res.startPage === res.endPage ? `Pg ${res.startPage}` : `Pg ${res.startPage}-${res.endPage}`}</td>
                                                <td className="px-6 py-4">
                                                    {Object.keys(res.fields).length > 0 ? (
                                                        <div className="flex flex-col gap-2 min-w-[200px]">
                                                            {Object.entries(res.fields).map(([key, val]) => (
                                                                <div key={key} className="flex flex-col">
                                                                    <span className="text-[10px] uppercase font-semibold text-gray-400">{key}</span>
                                                                    <input 
                                                                        type="text" 
                                                                        value={val}
                                                                        onChange={(e) => handleFieldChange(res.id, key, e.target.value)}
                                                                        className="border-b border-gray-300 focus:border-blue-500 outline-none bg-transparent py-0.5 text-sm font-medium text-gray-800"
                                                                    />
                                                                </div>
                                                            ))}
                                                        </div>
                                                    ) : (
                                                        <span className="text-xs text-gray-400 italic">No fields defined</span>
                                                    )}
                                                </td>
                                                <td className="px-6 py-4">
                                                    <input 
                                                        type="text"
                                                        value={res.finalFilename}
                                                        onChange={(e) => handleFilenameChange(res.id, e.target.value)}
                                                        className="w-full min-w-[300px] border border-transparent hover:border-gray-300 focus:border-blue-500 focus:bg-white rounded px-2 py-1 outline-none text-sm font-mono text-gray-700 bg-gray-50 transition-colors"
                                                    />
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* Re-process / Processing overlay if user downloads */}
                    {isProcessing && results && (
                         <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50">
                            <div className="bg-white p-8 rounded-xl shadow-2xl text-center w-96">
                                <div className="loader mx-auto mb-4 border-green-600 border-t-transparent"></div>
                                <h3 className="text-lg font-bold text-gray-800">{progressText}</h3>
                                <div className="w-full bg-gray-200 rounded-full h-2 mt-4 overflow-hidden">
                                    <div className="bg-green-600 h-2 rounded-full transition-all duration-200" style={{ width: `${progressPercent}%` }}></div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
